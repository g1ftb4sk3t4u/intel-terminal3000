name: Static smoke checks

on:
  pull_request:
    paths:
      - "intel-terminal3000/frontend/**"
      - "intel-terminal3000/backend/app/**"
      - ".github/workflows/frontend-smoke.yml"
  push:
    branches: [main]
    paths:
      - "intel-terminal3000/frontend/**"
      - "intel-terminal3000/backend/app/**"
      - ".github/workflows/frontend-smoke.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find intel-terminal3000/frontend -maxdepth 1 -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check

      - name: Validate frontend asset wiring and CSS structure
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("intel-terminal3000/frontend")
          errors = []

          styles = (root / "styles.css").read_text(encoding="utf-8")
          for target in re.findall(r'@import\s+url\(["\']([^"\']+)["\']\)', styles):
              if not (root / target).is_file():
                  errors.append(f"Missing CSS import: {target}")

          scripts = (root / "app.js").read_text(encoding="utf-8")
          for target in re.findall(r'src=["\']([^"\']+\.js)["\']', scripts):
              if not (root / target).is_file():
                  errors.append(f"Missing JavaScript asset: {target}")

          def css_brace_error(text: str):
              depth = 0
              quote = None
              escaped = False
              in_comment = False
              index = 0

              while index < len(text):
                  char = text[index]
                  next_char = text[index + 1] if index + 1 < len(text) else ""

                  if in_comment:
                      if char == "*" and next_char == "/":
                          in_comment = False
                          index += 2
                          continue
                      index += 1
                      continue

                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                      index += 1
                      continue

                  if char == "/" and next_char == "*":
                      in_comment = True
                      index += 2
                      continue

                  if char in {'"', "'"}:
                      quote = char
                  elif char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth < 0:
                          return "closing brace appears before a matching opening brace"

                  index += 1

              if in_comment:
                  return "unterminated comment"
              if quote:
                  return "unterminated quoted string"
              if depth:
                  return f"{depth} unmatched opening brace(s)"
              return None

          for path in sorted(root.glob("*.css")):
              problem = css_brace_error(path.read_text(encoding="utf-8"))
              if problem:
                  errors.append(f"CSS structure error in {path.name}: {problem}")

          if errors:
              raise SystemExit("\n".join(errors))

          print("Frontend assets and CSS structure validated.")

      - name: Validate Python syntax
        run: python -m compileall -q intel-terminal3000/backend/app
