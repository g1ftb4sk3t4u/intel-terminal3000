name: Static smoke checks

on:
  pull_request:
    paths:
      - "intel-terminal3000/frontend/**"
      - "intel-terminal3000/backend/app/**"
      - ".github/workflows/frontend-smoke.yml"
  push:
    branches: [main]
    paths:
      - "intel-terminal3000/frontend/**"
      - "intel-terminal3000/backend/app/**"
      - ".github/workflows/frontend-smoke.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find intel-terminal3000/frontend -maxdepth 1 -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 -n1 node --check

      - name: Validate frontend asset wiring and CSS structure
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("intel-terminal3000/frontend")
          errors = []

          styles = (root / "styles.css").read_text(encoding="utf-8")
          for target in re.findall(r'@import\s+url\(["\']([^"\']+)["\']\)', styles):
              if not (root / target).is_file():
                  errors.append(f"Missing CSS import: {target}")

          scripts = (root / "app.js").read_text(encoding="utf-8")
          for target in re.findall(r'src=["\']([^"\']+\.js)["\']', scripts):
              if not (root / target).is_file():
                  errors.append(f"Missing JavaScript asset: {target}")

          for path in sorted(root.glob("*.css")):
              text = path.read_text(encoding="utf-8")
              if text.count("{") != text.count("}"):
                  errors.append(
                      f"Unbalanced CSS braces in {path.name}: "
                      f"{text.count('{')} open / {text.count('}')} close"
                  )

          if errors:
              raise SystemExit("\n".join(errors))

          print("Frontend assets and CSS structure validated.")

      - name: Validate Python syntax
        run: python -m compileall -q intel-terminal3000/backend/app
